# dev stack: sources are mounted, server restarts on change (bun --watch), web is the vite dev server.
# Published: web (vite proxies /api and /ws to the server inside the compose network) and storybook.
name: xtc-toaster

x-bun: &bun
  image: oven/bun:1.4.2
  working_dir: /app
  # node_modules live in volumes: installed for linux inside the container (canvas is native),
  # never mixed with the host ones. A new package in packages/* needs its own volume here.
  volumes:
    - .:/app
    - nm_root:/app/node_modules
    - nm_contract:/app/packages/contract/node_modules
    - nm_lib:/app/packages/lib/node_modules
    - nm_server:/app/packages/server/node_modules
    - nm_toasts:/app/packages/toasts/node_modules
    - nm_web:/app/packages/web/node_modules
    # server uploads — kept out of the repo (container runs as root)
    - uploads:/data/uploads

services:
  install:
    <<: *bun
    command: bun install --frozen-lockfile

  server:
    <<: *bun
    # the same bun + ffmpeg (gif export) as the runtime image
    image: xtc-toaster-dev-server
    build:
      context: .
      target: ffmpeg
    command: bun --watch packages/server/src/index.ts
    environment:
      PORT: 3000
      UPLOADS_DIR: /data/uploads
      # linked composer rows over one render; unset in .env — the server fallback (4)
      RENDER_MAX_LAYERS: ${RENDER_MAX_LAYERS:-}
      # frames of one gif export; unset in .env — the server fallback (48)
      RENDER_MAX_FRAMES: ${RENDER_MAX_FRAMES:-}
    depends_on:
      install:
        condition: service_completed_successfully

  web:
    <<: *bun
    working_dir: /app/packages/web
    command: bun run dev --host 0.0.0.0 --port 5173 --strictPort
    environment:
      SERVER_HOST: server:3000
      # debug: picture uploaded on page open; on by default here, DEBUG_IMAGE= (empty) in .env turns it off
      DEBUG_IMAGE: ${DEBUG_IMAGE-packages/lib/tests/fixtures/poppies.jpg}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      install:
        condition: service_completed_successfully
      server:
        condition: service_started

  # the real nodes and panels on toasts from tests/toasts, for setting up the ui by hand — no server needed
  storybook:
    <<: *bun
    working_dir: /app/packages/web
    command: bun run storybook --ci --host 0.0.0.0
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  nm_root:
  nm_contract:
  nm_lib:
  nm_server:
  nm_toasts:
  nm_web:
  uploads:
