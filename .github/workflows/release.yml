name: Release

# any branch → test; master → test → release → docker (docs/sprints/sprint-3.spec.md, CI)
on:
  push:
    branches:
      - "**"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # tests run inside `docker build`, not on the runner: the `test` stage of the Dockerfile
      # (oven/bun + ffmpeg, the same base as prod) ends with `RUN bun run typecheck && bun run test`,
      # a red test fails the build → this job → no release. Nothing is pushed, the stage is thrown away.
      # Unchanged sources → that layer comes from the cache, tests aren't rerun (same input, same result).
      # `docker build --target test .` reproduces it locally
      - name: Typecheck & test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only — the only target is ru-timeweb
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # baked into the web build — the ui shows which version is hosted
          build-args: |
            APP_VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: |
            type=gha,scope=test
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
